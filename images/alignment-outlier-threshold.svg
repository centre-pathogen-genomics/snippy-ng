<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Schematic of per-sample posterior probability of belonging to the retained cluster, with two candidate thresholds and which samples are removed">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="40" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">How --alignment-outlier-threshold decides removal</text>
  <text x="40" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">Posterior probability that a sample belongs to the retained cluster(s), i.e. probability_retained in core.alignment-filter.tsv (schematic)</text>

  <rect x="90" y="96" width="144.0" height="114" fill="#fee2e2" opacity="0.55"/>
  <rect x="234.0" y="96" width="576.0" height="114" fill="#dcfce7" opacity="0.55"/>

  <line x1="90" y1="210" x2="810" y2="210" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="90.0" y1="210" x2="90.0" y2="216" stroke="#9ca3af"/><text x="90.0" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle">0.00</text><line x1="270.0" y1="210" x2="270.0" y2="216" stroke="#9ca3af"/><text x="270.0" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle">0.25</text><line x1="450.0" y1="210" x2="450.0" y2="216" stroke="#9ca3af"/><text x="450.0" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle">0.50</text><line x1="630.0" y1="210" x2="630.0" y2="216" stroke="#9ca3af"/><text x="630.0" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle">0.75</text><line x1="810.0" y1="210" x2="810.0" y2="216" stroke="#9ca3af"/><text x="810.0" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle">1.00</text>
  <text x="450" y="262" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#374151" text-anchor="middle">posterior probability of belonging to the retained cluster(s)</text>

  <line x1="234.0" y1="96" x2="234.0" y2="210" stroke="#111827" stroke-width="1.8"/>
  <text x="242.0" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827">threshold 0.20</text>
  <text x="242.0" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">(default)</text>
  <line x1="630.0" y1="96" x2="630.0" y2="210" stroke="#111827" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="638.0" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827">threshold 0.75</text>

  <text x="162.0" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#b91c1c" text-anchor="middle">removed (flag on)</text>
  <text x="522.0" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#15803d" text-anchor="middle">kept</text>

  <text x="138.0" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827">lower cluster</text>
  <text x="803.3" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="end">main cluster</text>

  <circle cx="90.7" cy="202" r="3.6" fill="#111827"/><circle cx="104.4" cy="194" r="3.6" fill="#111827"/><circle cx="126.0" cy="198" r="3.6" fill="#111827"/><circle cx="486.0" cy="202" r="3.6" fill="#111827"/><circle cx="781.2" cy="202" r="3.6" fill="#111827"/><circle cx="792.0" cy="194" r="3.6" fill="#111827"/><circle cx="799.2" cy="198" r="3.6" fill="#111827"/><circle cx="805.0" cy="191" r="3.6" fill="#111827"/><circle cx="809.3" cy="196" r="3.6" fill="#111827"/>

  <line x1="486.0" y1="187" x2="486.0" y2="196" stroke="#6b7280" stroke-width="1"/>
  <rect x="286" y="165" width="400" height="22" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="486.0" y="181" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle">ambiguous sample: kept with threshold 0.20, dropped with 0.75</text>

  <text x="40" y="330" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">With --remove-alignment-outliers off (the default) nothing is removed: the run warns and names the samples in the lower cluster.</text>
</svg>
